<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob: 'self'; style-src 'unsafe-inline'; img-src data: blob: 'self'; manifest-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Chess Kingdoms">
<meta name="theme-color" content="#14121c"><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Chess Kingdoms</title>
<style>
:root{--gold:#f0c257;--gold2:#b8862b;--ink:#14121c;--panel:rgba(22,19,32,.82);--line:rgba(240,194,87,.35);--txt:#f6f0e2;--dim:#b9b2a2;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(var(--panel),rgba(22,19,32,.62));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2}
.bar.top{top:0;padding-top:calc(8px + var(--st));border-bottom:1px solid var(--line)}
.bar.bottom{bottom:0;padding-bottom:calc(8px + var(--sb));border-top:1px solid var(--line)}
.who{min-width:0;flex:1}
.who>div:first-child{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caps{min-height:22px;font-size:19px;line-height:22px;letter-spacing:-2px;white-space:nowrap;overflow:hidden}
.caps.wht span{color:#fbf6ea;text-shadow:0 0 2px #000,0 1px 2px #000}.caps.blk span{color:#17141d;text-shadow:0 0 2px #fff,0 0 3px #fff}
.caps b{font-size:13px;letter-spacing:0;margin-left:8px;color:var(--gold)}
.ib{width:46px;height:46px;border-radius:12px;font-size:24px;background:rgba(255,255,255,.08);border:1px solid var(--line);flex:none}
.pill{flex:none;max-width:52vw;padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px;background:#fbf6ea;color:#1b1820;border:2px solid var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.black{background:#1b1820;color:#fbf6ea}.pill.think{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.acts{display:flex;gap:8px;flex:none}
.acts button{min-width:76px;height:48px;padding:0 12px;border-radius:12px;font-weight:700;font-size:15px;background:rgba(255,255,255,.09);border:1px solid var(--line)}
.acts button:active,.ib:active{background:rgba(240,194,87,.3)}.acts button:disabled{opacity:.35}
#screens{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:calc(14px + var(--st)) 14px calc(14px + var(--sb))}
#screens.open{display:flex;background:radial-gradient(ellipse at center,rgba(10,8,18,.25),rgba(10,8,18,.72))}
.screen{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.screen.wide{width:min(860px,100%)}
#sTitle{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:center;text-align:center}
h1{font:700 clamp(40px,9vw,76px)/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:1px;background:linear-gradient(#fff3c9,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 8px 18px rgba(0,0,0,.6))}
.tag{margin:8px 0 22px;font:italic 18px Georgia,serif;color:#fff;text-shadow:0 2px 6px #000}
.menu{display:flex;flex-direction:column;gap:11px;width:min(330px,100%)}
.btn{min-height:54px;padding:10px 18px;border-radius:14px;font-weight:800;font-size:18px;color:#231a05;background:linear-gradient(#ffe08a,var(--gold) 55%,#d59c2f);border:1px solid #fff2c2;box-shadow:0 4px 0 #7c5a17,0 8px 18px rgba(0,0,0,.45)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7c5a17}
.btn.alt{color:var(--txt);background:rgba(28,24,40,.86);border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.4)}
.btn.small{min-height:44px;font-size:15px}
.tip{margin-top:16px;font-size:13px;color:#fff;text-shadow:0 1px 4px #000;opacity:.9}
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}.head h2{margin:0;font:700 26px Georgia,serif;color:var(--gold)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:0;padding-right:4px}
label.row{display:block;margin:12px 0 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18)}
.chip.on{background:var(--gold);color:#231a05;border-color:#fff2c2}
h3{margin:16px 0 8px;font:700 18px Georgia,serif;display:flex;align-items:center;gap:8px}h3:before{content:"";width:14px;height:14px;border-radius:4px;background:var(--c);border:1px solid rgba(255,255,255,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.lvl{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 11px;min-height:78px;border-radius:14px;text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
.lvl .num{font:700 22px Georgia,serif;color:var(--gold)}.lvl .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.lvl .st{font-size:14px;color:var(--gold);letter-spacing:1px}
.lvl.locked{opacity:.42}.lvl.locked .st{color:var(--dim);letter-spacing:0;font-size:12px}.lvl.next{border-color:var(--gold);box-shadow:0 0 0 2px rgba(240,194,87,.35)}
.foot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.foot .btn{flex:1}
.center{text-align:center;align-items:center}.center h2{font:700 38px Georgia,serif;margin:0 0 6px;color:var(--gold)}
#resStars{font-size:44px;color:var(--gold);letter-spacing:6px;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.note{font-size:13px;color:var(--dim)}
#promoChoices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin-top:10px}
.promo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;font-size:14px}
.promo .glyph{font-size:44px;line-height:1;color:var(--gold)}
@media (max-width:560px){.acts button{min-width:0;padding:0 11px;font-size:14px}.pill{font-size:13px;padding:8px 11px}.screen{padding:16px}}
@media (max-height:520px){.tag{margin:4px 0 10px}.menu{display:grid;grid-template-columns:1fr 1fr;width:min(560px,100%)}h1{font-size:40px}.tip{display:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud" hidden>
  <div class="bar top">
    <button id="btnMenu" class="ib" aria-label="Menu">☰</button>
    <div class="who"><div id="oppName"></div><div id="capTop" class="caps"></div></div>
    <div id="status" class="pill"></div>
  </div>
  <div class="bar bottom">
    <div class="who"><div id="meName"></div><div id="capBot" class="caps"></div></div>
    <div class="acts"><button id="btnUndo">↶ Undo</button><button id="btnHint">✦ Hint</button><button id="btnView">◎ View</button></div>
  </div>
</div>
<div id="screens">
  <section id="sTitle" class="screen" hidden>
    <h1>Chess Kingdoms</h1><p class="tag">Where the pieces come alive</p>
    <div class="menu">
      <button id="btnContinue" class="btn" hidden>Continue game</button>
      <button id="btnCampaign" class="btn">Campaign · 50 levels</button>
      <button id="btnQuick" class="btn alt">Quick Battle</button>
      <button id="btnTwo" class="btn alt">Two Players</button>
      <button id="btnSettings" class="btn alt">Settings</button>
    </div>
    <p class="tip">Tap a piece, then tap where it should go. Drag to turn the board, pinch to zoom.</p>
  </section>
  <section id="sCampaign" class="screen wide" hidden>
    <div class="head"><button class="ib" data-back="sTitle" aria-label="Back">←</button><h2>Campaign</h2></div>
    <label class="row">Difficulty</label><div id="campDiff" class="chips"></div>
    <div id="levels" class="scroll"></div>
  </section>
  <section id="sSetup" class="screen" hidden>
    <div class="head"><button class="ib" data-back="sTitle" aria-label="Back">←</button><h2 id="setupTitle">Quick Battle</h2></div>
    <div class="scroll">
      <div id="rowDiff"><label class="row">Difficulty</label><div id="setDiff" class="chips"></div></div>
      <div id="rowSide"><label class="row">You play</label><div id="setSide" class="chips"></div></div>
      <div id="rowFlip"><label class="row">Board</label><div id="setFlip" class="chips"></div></div>
      <label class="row">Arena</label><div id="setTheme" class="chips"></div>
    </div>
    <div class="foot"><button id="btnStart" class="btn">Start battle</button></div>
  </section>
  <section id="sSettings" class="screen" hidden>
    <div class="head"><button class="ib" data-back="prev" aria-label="Back">←</button><h2>Settings</h2></div>
    <div class="scroll">
      <label class="row">Difficulty (new games)</label><div id="optDiff" class="chips"></div>
      <label class="row">Battle animations</label><div id="optAnim" class="chips"></div>
      <label class="row">Sound</label><div id="optSound" class="chips"></div>
      <label class="row">Chess symbols above pieces</label><div id="optLabels" class="chips"></div>
      <label class="row">Graphics</label><div id="optQuality" class="chips"></div>
      <label class="row">Campaign progress</label><button id="btnReset" class="btn alt small">Erase progress</button>
    </div>
  </section>
  <section id="sPause" class="screen center" hidden>
    <h2>Paused</h2>
    <div class="menu" style="margin-top:12px">
      <button id="btnResume" class="btn">Resume</button>
      <button id="btnRestart" class="btn alt">Restart battle</button>
      <button id="btnPauseSettings" class="btn alt">Settings</button>
      <button id="btnQuit" class="btn alt">Save and quit</button>
    </div>
  </section>
  <section id="sResult" class="screen center" hidden>
    <h2 id="resTitle"></h2><div id="resStars"></div><p id="resText"></p>
    <p id="resHelp" class="note">Win without hints or undos for three stars.</p>
    <div class="foot" style="width:100%"><button id="btnNext" class="btn">Next level</button><button id="btnAgain" class="btn alt">Play again</button><button id="btnResMenu" class="btn alt">Menu</button></div>
  </section>
  <section id="sPromo" class="screen center" hidden>
    <h2 style="font-size:26px">Promote your pawn</h2><div id="promoChoices"></div>
  </section>
</div>

$('qrSend').addEventListener('click',()=>navigator.share({title:'Chess Kingdoms',text:'Come play Chess Kingdoms with me!',url:link()}).catch(()=>{}));
$('qrCopy').addEventListener('click',async()=>{const t=$('qrCopy');try{await navigator.clipboard.writeText(link());t.textContent='Copied!'}catch(_){const r=document.createRange();r.selectNodeContents($('qrLink'));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent='Link selected'}setTimeout(()=>t.textContent='Copy link',1800)});
})();
</script>
